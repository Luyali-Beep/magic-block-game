        :root {
            --primary: #FF5E7E;
            --secondary: #38B6FF;
            --accent: #FFDE59;
            --text: #2D3436;
        }

        /* --- Native App Behaviors --- */
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none; /* Disables iOS long-press popups */
            -webkit-tap-highlight-color: transparent; /* Removes blue flash on Android/iOS taps */
            touch-action: none; /* Kills all default browser scrolling/zooming */
        }

        body {
            margin: 0; padding: 0; overflow: hidden;
            font-family: 'Nunito', sans-serif;
            display: flex; flex-direction: column; 
            height: 100vh; height: 100dvh;
        }

        /* --- Chunky, Fun UI --- */
        header {
            background: rgba(255, 255, 255, 0.95);
            padding: 12px 20px;
            display: flex; align-items: center; justify-content: space-between;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            border-bottom: 4px solid white;
            z-index: 10;
        }

        .logo {
            font-family: 'Fredoka One', cursive;
            font-size: 24px; color: var(--primary);
            text-shadow: 2px 2px 0px white, 3px 3px 0px rgba(0,0,0,0.1);
            display: flex; align-items: center; gap: 10px;
        }

        .toolbar-group { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: center; }

        button, select {
            padding: 10px 14px; font-size: 16px;
            border: none; border-radius: 20px;
            background-color: white; color: var(--text);
            cursor: pointer; font-weight: bold; font-family: 'Nunito', sans-serif;
            box-shadow: 0 4px 0 #D1D9E6, 0 5px 10px rgba(0,0,0,0.1);
            transition: all 0.1s cubic-bezier(0.4, 2, 0.2, 1);
        }

        button:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 0 0 #D1D9E6; }
        button:hover:not(:disabled) { background-color: #F8F9FA; transform: translateY(-2px); }
        button:disabled { opacity: 0.4; cursor: not-allowed; }

        .btn-magic { background-color: var(--primary); color: white; box-shadow: 0 4px 0 #D63056; }
        .btn-magic:hover:not(:disabled) { background-color: #FF708D; }
        select { box-shadow: inset 0 2px 5px rgba(0,0,0,0.05); border: 2px solid #E2E8F0; max-width: 160px; }

        main { flex: 1; position: relative; }

        #workspace { width: 100%; height: 100%; cursor: grab; overflow: hidden; position: absolute; touch-action: none; }
        #workspace:active { cursor: grabbing; }
        canvas { display: block; width: 100%; height: 100%; touch-action: none; }

        /* --- Scrollable Side Palette Grid (Single Line) --- */
        #palette {
            position: absolute; 
            top: 50%; left: 15px; 
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.95);
            padding: 15px 12px; border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15), inset 0 -4px 0 rgba(0,0,0,0.05);
            display: flex; flex-direction: column; gap: 12px;
            align-items: center;
            border: 4px solid white;
            z-index: 15;
            max-height: 70vh; 
            overflow-y: auto; overflow-x: hidden;
            touch-action: pan-y;
            scrollbar-width: thin;
            scrollbar-color: var(--secondary) #E0F6FF;
        }
        #palette::-webkit-scrollbar { width: 10px; }
        #palette::-webkit-scrollbar-track { background: #E0F6FF; border-radius: 10px; }
        #palette::-webkit-scrollbar-thumb { background-color: var(--secondary); border-radius: 10px; border: 2px solid white; }

        .color-swatch {
            width: 48px; height: 48px; border-radius: 12px; flex-shrink: 0;
            cursor: grab;
            box-shadow: 0 6px 0 rgba(0,0,0,0.15), inset 0 5px 10px rgba(255,255,255,0.4);
            transition: transform 0.2s cubic-bezier(0.4, 2, 0.2, 1);
            position: relative;
            touch-action: none; 
        }
        .color-swatch::after {
            content: ''; position: absolute; top: 5px; left: 12px; width: 24px; height: 8px;
            background: rgba(255,255,255,0.5); border-radius: 4px;
        }

        /* --- Blueprint/Reference with Glowing Colorful Border --- */
        @keyframes rainbowGlow {
            0% { border-color: #FF5E7E; box-shadow: 0 8px 25px rgba(255, 94, 126, 0.5); }
            25% { border-color: #FFDE59; box-shadow: 0 8px 25px rgba(255, 222, 89, 0.5); }
            50% { border-color: #38B6FF; box-shadow: 0 8px 25px rgba(56, 182, 255, 0.5); }
            75% { border-color: #2ED573; box-shadow: 0 8px 25px rgba(46, 213, 115, 0.5); }
            100% { border-color: #FF5E7E; box-shadow: 0 8px 25px rgba(255, 94, 126, 0.5); }
        }

        #reference-panel {
            position: absolute; top: 15px; right: 15px;
            width: 120px; height: 120px;
            background: white; border: 4px solid var(--secondary); border-radius: 16px;
            cursor: pointer; display: none; overflow: hidden; z-index: 20;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            animation: rainbowGlow 4s infinite linear;
        }
        #reference-panel::before {
            content: "💡 Blueprint"; display: block; background: var(--secondary);
            color: white; font-size: 11px; text-align: center; padding: 4px 0; font-weight: bold;
        }
        #ref-canvas { width: 100%; height: calc(100% - 22px); background: #f8fbff; }

        #reference-panel.expanded {
            top: 50%; right: 50%; transform: translate(50%, -50%);
            width: 85vmin; height: 85vmin; border-width: 8px;
            box-shadow: 0 0 0 2000px rgba(0,0,0,0.6) !important;
            animation: none; border-color: white;
        }

        /* --- Cute Helper Toast --- */
        #helper {
            position: absolute; bottom: 30px; left: 50%;
            transform: translateX(-50%);
            background: white; padding: 12px 18px; border-radius: 20px;
            font-size: 16px; color: var(--text); border: 3px solid var(--accent);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1); pointer-events: none;
            display: flex; align-items: center; gap: 10px; z-index: 5;
            animation: floatHelper 3s infinite ease-in-out;
            white-space: nowrap;
        }
        @keyframes floatHelper { 0%, 100% { transform: translate(-50%, 0); } 50% { transform: translate(-50%, -10px); } }

        /* Responsive UI for Phones & Tablets */
        @media (max-width: 768px) {
            header { flex-wrap: wrap; justify-content: space-evenly; gap: 8px; padding: 8px; }
            .logo { width: 100%; justify-content: center; font-size: 20px; margin-bottom: 4px; }

            .color-swatch { width: 42px; height: 42px; }
            #helper { font-size: 14px; padding: 8px 12px; }
            #reference-panel { top: 95px; right: 10px; width: 90px; height: 90px; }

    </style>

<script>
    // --- Haptic Feedback Engine ---
    function triggerHaptic(strength) {
        if (typeof navigator !== 'undefined' && navigator.vibrate) {
            try {
                if (strength === 'light') navigator.vibrate(10);
                else if (strength === 'heavy') navigator.vibrate([20, 10, 20]);
                else navigator.vibrate(15);
            } catch (e) {}
        }
    }

    // --- Audio System ---
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let actx = null;

    function initAudio() {
        if (!actx) actx = new AudioCtx();
        if (actx.state === 'suspended') actx.resume();
    }

    function playSound(type) {
        if (!actx) return;
        const osc = actx.createOscillator();
        const gain = actx.createGain();
        osc.connect(gain); gain.connect(actx.destination);
        const now = actx.currentTime;
        
        if (type === 'pop') {
            triggerHaptic('light');
            osc.type = 'sine'; osc.frequency.setValueAtTime(400, now); osc.frequency.exponentialRampToValueAtTime(800, now + 0.1);
            gain.gain.setValueAtTime(0.3, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
            osc.start(now); osc.stop(now + 0.1);
        } else if (type === 'pickup') {
            triggerHaptic('medium');
            osc.type = 'triangle'; osc.frequency.setValueAtTime(600, now); osc.frequency.exponentialRampToValueAtTime(300, now + 0.1);
            gain.gain.setValueAtTime(0.2, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
            osc.start(now); osc.stop(now + 0.1);
        } else if (type === 'trash') {
            triggerHaptic('heavy');
            osc.type = 'sawtooth'; osc.frequency.setValueAtTime(200, now); osc.frequency.exponentialRampToValueAtTime(50, now + 0.2);
            gain.gain.setValueAtTime(0.2, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
            osc.start(now); osc.stop(now + 0.2);
        } else if (type === 'magic') {
            triggerHaptic('heavy');
            osc.type = 'sine'; osc.frequency.setValueAtTime(400, now); osc.frequency.setValueAtTime(600, now + 0.1); osc.frequency.setValueAtTime(800, now + 0.2);
            gain.gain.setValueAtTime(0.2, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.4);
            osc.start(now); osc.stop(now + 0.4);
        }
    }

        cupcake: [ {x:-1,y:0,c:11}, {x:0,y:0,c:11}, {x:1,y:0,c:11}, {x:-1,y:1,c:11}, {x:0,y:1,c:11}, {x:1,y:1,c:11}, {x:-2,y:2,c:7}, {x:-1,y:2,c:7}, {x:0,y:2,c:7}, {x:1,y:2,c:7}, {x:2,y:2,c:7}, {x:-1,y:3,c:7}, {x:0,y:3,c:7}, {x:1,y:3,c:7}, {x:0,y:4,c:0} ],
        apple: [ {x:0,y:0,c:0}, {x:-1,y:1,c:0}, {x:0,y:1,c:0}, {x:1,y:1,c:0}, {x:-1,y:2,c:0}, {x:0,y:2,c:0}, {x:1,y:2,c:0}, {x:-1,y:3,c:0}, {x:1,y:3,c:0}, {x:0,y:4,c:11}, {x:1,y:4,c:3} ],
        fish: [ {x:0,y:0,c:1}, {x:1,y:0,c:1}, {x:-1,y:1,c:1}, {x:0,y:1,c:1}, {x:1,y:1,c:1}, {x:2,y:1,c:1}, {x:-2,y:2,c:1}, {x:-1,y:2,c:1}, {x:0,y:2,c:1}, {x:1,y:2,c:8}, {x:-1,y:3,c:1}, {x:0,y:3,c:1}, {x:1,y:3,c:1} ],
        spider: [ {x:-1,y:0,c:9}, {x:1,y:0,c:9}, {x:-2,y:1,c:9}, {x:0,y:1,c:9}, {x:2,y:1,c:9}, {x:-1,y:2,c:9}, {x:0,y:2,c:9}, {x:1,y:2,c:9}, {x:-1,y:3,c:0}, {x:1,y:3,c:0} ]
    };
    let activeTemplate = 'none';

    // --- DOM Elements ---
    const canvas = document.getElementById('main-canvas');
    const ctx = canvas.getContext('2d');
    const refCanvas = document.getElementById('ref-canvas');
    const refCtx = refCanvas.getContext('2d');
    
    const paletteDiv = document.getElementById('palette');
    const refPanel = document.getElementById('reference-panel');
    const templateSelect = document.getElementById('template-select');
    
    const btnUndo = document.getElementById('btn-undo');
    const btnRedo = document.getElementById('btn-redo');
    const btnReset = document.getElementById('btn-reset');
    const zoomInBtn = document.getElementById('btn-zoom-in');
    const zoomOutBtn = document.getElementById('btn-zoom-out');
    const btnFullscreen = document.getElementById('btn-fullscreen');

    // --- Initialization ---
    function init() {
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);
        
        offsetX = canvas.width / 2;
        offsetY = canvas.height - 180;

        COLORS.forEach(color => {
            let swatch = document.createElement('div');
            swatch.className = 'color-swatch';
            swatch.style.backgroundColor = color;
            
            // Pointer Event attachment for Palette elements
            swatch.addEventListener('pointerdown', (e) => {
                e.preventDefault(); 
                e.stopPropagation();
                initAudio();
                
                if(blocks.length >= MAX_BLOCKS) return;
                
                isDragging = true;
                updateMousePos(e);
                
                // Initialize physics start points
                dragRenderX = mouseScreenX;
                dragRenderY = mouseScreenY;
                hoveredBlockIndex = -1;
                
                // NATIVE FEEL: Squish start size, bounce to target scale
                draggedBlock = { 
                    color: color, sourceIndex: -1, 
                    offsetX: BLOCK_SIZE / 2, offsetY: BLOCK_SIZE / 2,
                    scale: 0.5, targetScale: 1.15, 
                    isTouch: e.pointerType === 'touch'
                };
                
                playSound('pickup');
                document.getElementById('helper').style.display = 'none';
                
                swatch.setPointerCapture(e.pointerId);
                activePointerId = e.pointerId;
            });

            swatch.addEventListener('pointermove', onPointerMove);
            swatch.addEventListener('pointerup', onPointerUp);
            swatch.addEventListener('pointercancel', onPointerUp);

        });

    }

    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }

    // --- Color Blending (Seasons) ---
    function hexToRgb(hex) {
        let bigint = parseInt(hex.replace('#',''), 16);
        return {r: (bigint >> 16) & 255, g: (bigint >> 8) & 255, b: bigint & 255};
    }

    function lerpColor(a, b, amount) {
        let rgbA = hexToRgb(a); let rgbB = hexToRgb(b);
        let r = Math.round(rgbA.r + (rgbB.r - rgbA.r) * amount);
        let g = Math.round(rgbA.g + (rgbB.g - rgbA.g) * amount);
        let bOut = Math.round(rgbA.b + (rgbB.b - rgbA.b) * amount);
        return `rgb(${r},${g},${bOut})`;
    }

    // --- State Management ---
    function saveState() {
        history = history.slice(0, historyIndex + 1);
        history.push(JSON.parse(JSON.stringify(blocks)));
        historyIndex++;
        updateUI();
    }

    function undo() {
        if (historyIndex > 0) {
            historyIndex--;
            blocks = JSON.parse(JSON.stringify(history[historyIndex]));
            updateUI(); playSound('trash'); spawnParticles(canvas.width/2, canvas.height/2, '#999');
        }
    }

    function redo() {
        if (historyIndex < history.length - 1) {
            historyIndex++;
            blocks = JSON.parse(JSON.stringify(history[historyIndex]));
            updateUI(); playSound('pop');
        }
    }

    function reset() {
        blocks = [];
        saveState();
        offsetX = canvas.width / 2;
        offsetY = canvas.height - 180;
        zoom = 1.0;
        playSound('magic');
        spawnParticles(canvas.width/2, canvas.height/2, '#FFDE59', 30);
    }

    function updateUI() {
        btnUndo.disabled = historyIndex <= 0;
        btnRedo.disabled = historyIndex >= history.length - 1;
    }

    function screenToWorld(x, y) { return { x: (x - offsetX) / zoom, y: (y - offsetY) / zoom }; }
    function worldToScreen(x, y) { return { x: (x * zoom) + offsetX, y: (y * zoom) + offsetY }; }

    // --- Weather & Particles ---
    function spawnParticles(screenX, screenY, color, count=10) {
        for(let i=0; i<count; i++) {
            particles.push({
                x: screenX, y: screenY,
                vx: (Math.random() - 0.5) * 15, vy: (Math.random() - 1) * 15,
                life: 1.0, color: color, size: Math.random() * 8 + 4
            });
        }
    }

    function updateAndDrawEffects(ctx, s1, s2, blend) {
        // Draw physical explosion particles
        for(let i = particles.length - 1; i >= 0; i--) {
            let p = particles[i];
            p.x += p.vx; p.y += p.vy;
            p.vy += 0.5; p.life -= 0.02;
            if(p.life <= 0) { particles.splice(i, 1); continue; }
            ctx.globalAlpha = p.life;
            ctx.fillStyle = p.color;
            ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
        }
        ctx.globalAlpha = 1.0;

        // Dynamic Weather Spawning based on season
        if (Math.random() < 0.05) {
            let currentS = (blend > 0.5) ? s2.name : s1.name;
            if (currentS === 'Winter') {
                weatherSystem.push({ x: Math.random() * canvas.width, y: -20, vx: (Math.random() - 0.5)*2, vy: Math.random() * 2 + 1, type: 'snow' });
            } else if (currentS === 'Autumn') {
                weatherSystem.push({ x: Math.random() * canvas.width, y: -20, vx: Math.random() * 3 + 1, vy: Math.random() * 1.5 + 1, type: 'leaf' });
            } else if (currentS === 'Summer' && Math.random() < 0.2) {
                weatherSystem.push({ x: Math.random() * canvas.width, y: canvas.height + 20, vx: (Math.random() - 0.5), vy: -(Math.random() * 2 + 1), type: 'bubble' });
            }
        }

        // Draw Weather
        for(let i = weatherSystem.length - 1; i >= 0; i--) {
            let w = weatherSystem[i];
            w.x += w.vx; w.y += w.vy;
            if (w.type === 'snow') {
                ctx.fillStyle = 'rgba(255,255,255,0.8)';
                ctx.beginPath(); ctx.arc(w.x, w.y, 4, 0, Math.PI * 2); ctx.fill();
            } else if (w.type === 'leaf') {
                ctx.fillStyle = '#E67E22';
                ctx.fillRect(w.x, w.y, 8, 6);
            } else if (w.type === 'bubble') {
                ctx.strokeStyle = 'rgba(255,255,255,0.6)';
                ctx.lineWidth = 1;
                ctx.beginPath(); ctx.arc(w.x, w.y, 6, 0, Math.PI * 2); ctx.stroke();
            }
            if (w.y > canvas.height + 50 || w.y < -50 || w.x > canvas.width + 50) weatherSystem.splice(i, 1);
        }
    }

    function drawScenery(ctx) {
        // Calculate smooth season morphing
        let currentSeasonIdx = Math.floor(seasonTimer / SEASON_DURATION) % SEASONS.length;
        let nextSeasonIdx = (currentSeasonIdx + 1) % SEASONS.length;
        let transitionProgress = (seasonTimer % SEASON_DURATION) / SEASON_DURATION;
        
        let blend = 0; // Hold season for 70%, transition for 30%
        if (transitionProgress > 0.7) blend = (transitionProgress - 0.7) / 0.3;
        
        let s1 = SEASONS[currentSeasonIdx];
        let s2 = SEASONS[nextSeasonIdx];

        let skyTop = lerpColor(s1.skyTop, s2.skyTop, blend);
        let skyBot = lerpColor(s1.skyBot, s2.skyBot, blend);
        let hill1 = lerpColor(s1.hill1, s2.hill1, blend);
        let hill2 = lerpColor(s1.hill2, s2.hill2, blend);

        // Sky Gradient
        let grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
        grad.addColorStop(0, skyTop); grad.addColorStop(1, skyBot);
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Clouds
        ctx.fillStyle = 'rgba(255,255,255,0.8)';
        clouds.forEach(c => {
            c.x += c.speed;
            if (c.x > canvas.width + 100) c.x = -100;
            ctx.beginPath();
            ctx.arc(c.x, c.y, 30*c.scale, 0, Math.PI*2);
            ctx.arc(c.x + 25*c.scale, c.y - 15*c.scale, 35*c.scale, 0, Math.PI*2);
            ctx.arc(c.x + 50*c.scale, c.y, 25*c.scale, 0, Math.PI*2);
            ctx.fill();
        });

        // Hills
        ctx.fillStyle = hill1;
        ctx.beginPath();
        ctx.moveTo(0, offsetY + BLOCK_SIZE);
        ctx.quadraticCurveTo(canvas.width*0.25, offsetY - 20, canvas.width*0.5, offsetY + BLOCK_SIZE);
        ctx.quadraticCurveTo(canvas.width*0.75, offsetY + 60, canvas.width, offsetY + BLOCK_SIZE);
        ctx.lineTo(canvas.width, canvas.height); ctx.lineTo(0, canvas.height); ctx.fill();

        ctx.fillStyle = hill2;
        ctx.fillRect(0, offsetY + BLOCK_SIZE, canvas.width, 10);
        
        return {s1, s2, blend};
    }

    // --- Core Rendering Loop ---
    let dashOffset = 0;

    function gameLoop() {
        let now = performance.now();
        let dt = now - lastRenderTime;
        lastRenderTime = now;
        seasonTimer += dt;
        dashOffset -= 0.5; // marching ants animation for hover

        ctx.clearRect(0, 0, canvas.width, canvas.height);
        let seasonData = drawScenery(ctx);
        
        ctx.save();
        ctx.translate(offsetX, offsetY);
        ctx.scale(zoom, zoom);

        // Blueprint Guide
        if (activeTemplate !== 'none') {
            const template = TEMPLATES[activeTemplate];
            ctx.globalAlpha = 0.3;
            template.forEach(b => drawRoundedBlock(ctx, b.x * BLOCK_SIZE, -(b.y * BLOCK_SIZE), COLORS[b.c], false));
            ctx.globalAlpha = 1.0;
        }

        // Render placed blocks and HOVER GLOW
        blocks.forEach((b, i) => {
            drawRoundedBlock(ctx, b.x, b.y, b.color, true);
            
            // Draw interactive Glowing Border if hovered
            if (i === hoveredBlockIndex && !isDragging) {
                ctx.save();
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.9)';
                ctx.lineWidth = 4;
                ctx.lineDashOffset = dashOffset;
                ctx.setLineDash([8, 6]);
                ctx.beginPath();
                if(ctx.roundRect) ctx.roundRect(b.x - 3, b.y - 12, BLOCK_SIZE + 6, BLOCK_SIZE + 14, 10);
                else ctx.rect(b.x - 3, b.y - 12, BLOCK_SIZE + 6, BLOCK_SIZE + 14);
                ctx.stroke();
                ctx.restore();
            }
        });

        // Snap Ghost Preview (Shows exactly where it will drop)
        if (isDragging && draggedBlock) {
            let worldPos = screenToWorld(mouseScreenX, mouseScreenY);
            let snap = calculateSnap(worldPos.x - draggedBlock.offsetX + BLOCK_SIZE/2, worldPos.y - draggedBlock.offsetY + BLOCK_SIZE/2);
            
            ctx.globalAlpha = 0.4;
            drawRoundedBlock(ctx, snap.x, snap.y, draggedBlock.color, true);
            ctx.globalAlpha = 1.0;
        }

        ctx.restore();

        // NATIVE FEEL: Real-Life Physical Block Dragging (Cursor Follower with LERP, SCALE, & TILT)
        if (isDragging && draggedBlock) {
            // Smoothly interpolate towards the actual mouse position
            dragRenderX += (mouseScreenX - dragRenderX) * 0.4;
            dragRenderY += (mouseScreenY - dragRenderY) * 0.4;

            // Elastic bounce scale (squish and pop)
            draggedBlock.scale += (draggedBlock.targetScale - draggedBlock.scale) * 0.35;

            // Calculate tilt based on velocity distance
            let tilt = (mouseScreenX - dragRenderX) * 0.015;
            tilt = Math.max(-0.25, Math.min(0.25, tilt)); // cap tilt

            // FAT-FINGER LIFT: Push the visual block up so the finger doesn't hide it
            let touchLift = draggedBlock.isTouch ? 60 * zoom : 0;

            ctx.save();
            
            // Move coordinate origin exactly to the physics render point minus offsets and touch lift
            ctx.translate(
                dragRenderX - (draggedBlock.offsetX * zoom), 
                dragRenderY - (draggedBlock.offsetY * zoom) - touchLift
            );
            
            ctx.scale(zoom, zoom); 
            
            // Translate to the middle of the block to apply tilts and scales safely
            ctx.translate(BLOCK_SIZE/2, BLOCK_SIZE/2);
            ctx.rotate(tilt); 
            ctx.scale(draggedBlock.scale, draggedBlock.scale);
            ctx.translate(-BLOCK_SIZE/2, -BLOCK_SIZE/2);
            
            drawRoundedBlock(ctx, 0, 0, draggedBlock.color, true);
            ctx.restore();
        }

        updateAndDrawEffects(ctx, seasonData.s1, seasonData.s2, seasonData.blend);
        requestAnimationFrame(gameLoop);
    }

    function drawRoundedBlock(ctx, x, y, color, shiny=true) {
        const radius = 8; const sz = BLOCK_SIZE;
        ctx.fillStyle = color;
        ctx.beginPath();
        if(ctx.roundRect) ctx.roundRect(x, y, sz, sz, radius); else ctx.rect(x, y, sz, sz);
        ctx.fill();
        
        if (shiny) {
            ctx.fillStyle = 'rgba(255,255,255,0.4)';
            ctx.beginPath();
            if(ctx.roundRect) ctx.roundRect(x, y, sz, 10, [radius, radius, 0, 0]); else ctx.rect(x, y, sz, 10);
            ctx.fill();
            
            ctx.fillStyle = 'rgba(0,0,0,0.15)';
            ctx.beginPath();
            if(ctx.roundRect) ctx.roundRect(x, y + sz - 10, sz, 10, [0, 0, radius, radius]); else ctx.rect(x, y + sz - 10, sz, 10);
            ctx.fill();
            
            ctx.fillStyle = color;
            ctx.beginPath();
            if(ctx.roundRect) ctx.roundRect(x + 12, y - 8, sz - 24, 12, 4); else ctx.rect(x + 12, y - 8, sz - 24, 12);
            ctx.fill();
            
            ctx.fillStyle = 'rgba(255,255,255,0.4)'; 
            ctx.fillRect(x + 15, y - 6, sz - 30, 3);
        }
    }

    // --- REFACTORED POINTER INTERACTION LOGIC ---
    function updateMousePos(e) {
        mouseScreenX = e.clientX; 
        mouseScreenY = e.clientY;
    }

    // Checking Exact Surface hitboxes! (x to x+sz, y-12 to y+sz to perfectly encompass bottom/middle/top nub)
    function getBlockAt(worldX, worldY) {
        for (let i = blocks.length - 1; i >= 0; i--) {
            let b = blocks[i];
            if (worldX >= b.x && worldX <= b.x + BLOCK_SIZE && 
                worldY >= b.y - 12 && worldY <= b.y + BLOCK_SIZE) {
                return i;
            }
        }
        return -1;
    }

    function isOccupied(x, y) { return blocks.some(b => b.x === x && b.y === y); }

    function calculateSnap(worldX, worldY) {
        let snapX = Math.round((worldX - BLOCK_SIZE/2) / BLOCK_SIZE) * BLOCK_SIZE;
        let snapY = Math.round((worldY - BLOCK_SIZE/2) / BLOCK_SIZE) * BLOCK_SIZE;
        if (snapY > 0) snapY = 0; 
        while (isOccupied(snapX, snapY)) snapY -= BLOCK_SIZE;
        return { x: snapX, y: snapY };
    }

    const onPointerMove = (e) => {
        if (activePointerId !== null && activePointerId !== e.pointerId) return; 
        updateMousePos(e);

        if (!isDragging && !isPanning) {
            let worldPos = screenToWorld(mouseScreenX, mouseScreenY);
            hoveredBlockIndex = getBlockAt(worldPos.x, worldPos.y);
        } else {
            hoveredBlockIndex = -1; // disable glow while interacting
        }

        if (isDragging || isPanning) {
            e.preventDefault(); e.stopPropagation();
        }
        
        if (isPanning) {
            offsetX = mouseScreenX - panStartX;
            offsetY = mouseScreenY - panStartY;
        }
    };

    const onPointerUp = (e) => {
        if (activePointerId !== e.pointerId) return;
        e.preventDefault(); e.stopPropagation();

        if (isDragging && draggedBlock) {
            const rect = canvas.getBoundingClientRect();
            // Drop within bounds check
            if (mouseScreenX >= rect.left && mouseScreenX <= rect.right &&
                mouseScreenY >= rect.top && mouseScreenY <= rect.bottom) {
                
                let worldPos = screenToWorld(mouseScreenX, mouseScreenY);
                
                let blockOriginX = worldPos.x - draggedBlock.offsetX;
                let blockOriginY = worldPos.y - draggedBlock.offsetY;
                
                let snap = calculateSnap(blockOriginX + BLOCK_SIZE/2, blockOriginY + BLOCK_SIZE/2);
                
                blocks.push({ x: snap.x, y: snap.y, color: draggedBlock.color });
                // Order physically so layers draw properly
                blocks.sort((a, b) => b.y !== a.y ? b.y - a.y : a.x - b.x);
                
                playSound('pop');
                let sc = worldToScreen(snap.x + BLOCK_SIZE/2, snap.y + BLOCK_SIZE/2);
                spawnParticles(sc.x, sc.y, draggedBlock.color, 15);
                
                saveState();
            } else if (draggedBlock.sourceIndex !== -1) {
                // Thrown out of canvas entirely bounds = delete
                playSound('trash');
                spawnParticles(mouseScreenX, mouseScreenY, draggedBlock.color, 25);
                saveState();
            }
            isDragging = false; 
            draggedBlock = null;
        }
        
        isPanning = false;
        
        // Immediate clean state release
        try { e.target.releasePointerCapture(e.pointerId); } catch(err) {}
        activePointerId = null;
    };

    const onCanvasPointerDown = (e) => {
        if (e.pointerType === 'mouse' && e.button !== 0 && e.button !== 1 && e.button !== 2) return;
        
        e.preventDefault(); e.stopPropagation();
        initAudio(); updateMousePos(e);
        
        canvas.setPointerCapture(e.pointerId);
        activePointerId = e.pointerId;
        
        if (e.button === 2 || e.button === 1 || !e.isPrimary) {
            isPanning = true; 
            panStartX = mouseScreenX - offsetX; panStartY = mouseScreenY - offsetY;
            return;
        }

        let worldPos = screenToWorld(mouseScreenX, mouseScreenY);
        let clickedIndex = getBlockAt(worldPos.x, worldPos.y);
        
        let now = Date.now();
        let dist = Math.hypot(mouseScreenX - lastTapX, mouseScreenY - lastTapY);

        if (now - lastTapTime < 400 && dist < 30 && clickedIndex !== -1) {
            let b = blocks[clickedIndex];
            blocks.splice(clickedIndex, 1);
            playSound('trash');
            spawnParticles(mouseScreenX, mouseScreenY, b.color, 20);
            saveState();
            
            lastTapTime = 0; isDragging = false; draggedBlock = null; hoveredBlockIndex = -1;
            updateUI(); canvas.releasePointerCapture(e.pointerId); activePointerId = null;
            return;
        }
        
        lastTapTime = now; lastTapX = mouseScreenX; lastTapY = mouseScreenY;

        if (clickedIndex !== -1) {
            isDragging = true;
            let b = blocks[clickedIndex];
            
            let offX = worldPos.x - b.x;
            let offY = worldPos.y - b.y;

            dragRenderX = mouseScreenX; dragRenderY = mouseScreenY;
            
            // NATIVE FEEL: Pop scale
            draggedBlock = { 
                color: b.color, sourceIndex: clickedIndex, 
                offsetX: offX, offsetY: offY,
                scale: 0.7, targetScale: 1.15,
                isTouch: e.pointerType === 'touch'
            };
            
            blocks.splice(clickedIndex, 1);
            playSound('pickup');
            hoveredBlockIndex = -1;
            updateUI(); 
        } else if (e.pointerType === 'touch') {
            isPanning = true; 
            panStartX = mouseScreenX - offsetX; panStartY = mouseScreenY - offsetY;
        }
    };

    // Main Canvas Events
    canvas.addEventListener('pointerdown', onCanvasPointerDown);
    canvas.addEventListener('pointermove', onPointerMove);
    canvas.addEventListener('pointerup', onPointerUp);
    canvas.addEventListener('pointercancel', onPointerUp);
    canvas.addEventListener('contextmenu', e => e.preventDefault());

    // Wheel zooming
    canvas.addEventListener('wheel', (e) => {
        e.preventDefault();
        const oldZoom = zoom;
        zoom += (e.deltaY < 0) ? 0.1 : -0.1;
        zoom = Math.max(0.4, Math.min(zoom, 2.5));
        offsetX = mouseScreenX - ((mouseScreenX - offsetX) / oldZoom * zoom);
        offsetY = mouseScreenY - ((mouseScreenY - offsetY) / oldZoom * zoom);
    }, {passive: false});

    // --- UI Listeners ---
    btnUndo.addEventListener('click', undo);
    btnRedo.addEventListener('click', redo);
    btnReset.addEventListener('click', reset);
    
    btnFullscreen.addEventListener('click', () => {
        if (!document.fullscreenElement) {
            if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(()=>{});
            else if (document.documentElement.webkitRequestFullscreen) document.documentElement.webkitRequestFullscreen();
            btnFullscreen.textContent = '↙️';
        } else {
            if (document.exitFullscreen) document.exitFullscreen();
            else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
            btnFullscreen.textContent = '📺';
        }
        playSound('pickup');
    });

    zoomInBtn.addEventListener('click', () => { zoom = Math.min(zoom + 0.2, 2.5); playSound('pickup'); });
    zoomOutBtn.addEventListener('click', () => { zoom = Math.max(zoom - 0.2, 0.4); playSound('pickup'); });

    templateSelect.addEventListener('change', (e) => {
        activeTemplate = e.target.value; playSound('magic');
        spawnParticles(canvas.width/2, canvas.height/4, '#FFDE59', 20);
        if (activeTemplate === 'none') {
            refPanel.style.display = 'none'; refPanel.classList.remove('expanded');
        } else {
            refPanel.style.display = 'block'; drawThumbnail();
        }
    });

    refPanel.addEventListener('click', () => {
        playSound('pickup'); refPanel.classList.toggle('expanded');
        setTimeout(drawThumbnail, 400);
    });

    function drawThumbnail() {
        if (activeTemplate === 'none') return;
        refCanvas.width = refPanel.clientWidth;
        refCanvas.height = refPanel.clientHeight - 22; 
        refCtx.clearRect(0, 0, refCanvas.width, refCanvas.height);
        
        const template = TEMPLATES[activeTemplate];
        let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
        template.forEach(b => {
            if(b.x < minX) minX = b.x; if(b.x > maxX) maxX = b.x;
            if(b.y < minY) minY = b.y; if(b.y > maxY) maxY = b.y;
        });

        let wUnits = (maxX - minX + 1), hUnits = (maxY - minY + 1);
        let scale = Math.min((refCanvas.width - 20) / (wUnits * BLOCK_SIZE), (refCanvas.height - 20) / (hUnits * BLOCK_SIZE));

        refCtx.save(); refCtx.translate(refCanvas.width / 2, refCanvas.height / 2); refCtx.scale(scale, scale);
        let cx = ((minX + maxX) / 2) * BLOCK_SIZE + (BLOCK_SIZE/2);
        let cy = -((minY + maxY) / 2) * BLOCK_SIZE - (BLOCK_SIZE/2);
        refCtx.translate(-cx, -cy);

        template.forEach(b => drawRoundedBlock(refCtx, b.x * BLOCK_SIZE, -(b.y * BLOCK_SIZE), COLORS[b.c], true));
        refCtx.restore();
    }

    init();
</script>
</body>
</html>
